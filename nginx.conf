server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    server_name  example.com www.example.com; 
    port_in_redirect off;
    
    # Security configurations
    server_tokens off;  # Hide nginx version
    client_max_body_size 10M;  # Limit upload size
    
    # Logging
    access_log /home/site/access.log;
    error_log /home/site/error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    # Rate limiting
    limit_req zone=api burst=20 nodelay;
    
    # Block access to sensitive files
    location ~* /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to backup files
    location ~* \.(bak|backup|old|orig|save|swp|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to configuration files
    location ~* \.(conf|config|ini)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {            
        index  index.php index.html index.htm hostingstart.html;
        try_files $uri $uri/ =404;
    }
	
    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    location ~* [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        include /etc/nginx/fastcgi.conf;
        include /etc/nginx/fastcgi_params;
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }
        fastcgi_param HTTP_PROXY "";
        root /home/site/wwwroot;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # PHP security headers
        fastcgi_param PHP_VALUE "open_basedir=/home/site/wwwroot/:/tmp/";
        fastcgi_param PHP_ADMIN_VALUE "disable_functions=exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source";
    }
}
